ster</a></div></div>';return}const [type,title,place,approved,released,utilized,progress,status,dept,contractor,start,end]=p;const bal=released-utilized;a.innerHTML='<a class="back" href="projects.html">← Back to project register</a><section class="view-head"><p class="eyebrow">'+esc(type.toUpperCase())+' • '+esc(id)+'</p><h1>'+esc(title)+'</h1><p class="lead">'+esc(place)+' • '+esc(dept)+'</p><div class="badges"><span>DEMO RECORD</span><span>NOT VERIFIED</span><span>PROTOTYPE DATA</span></div></section><div class="metrics"><div class="metric"><small>PROJECT PROGRESS</small><h2>'+progress+'%</h2><div class="bar"><i style="width:'+progress+'%"></i></div><small>'+esc(status)+'</small></div><div class="metric"><small>APPROVED</small><h2>'+cr(approved)+'</h2><small>Approved value</small></div><div class="metric"><small>RELEASED</small><h2>'+cr(released)+'</h2><small>'+Math.round(released/approved*100)+'% of approved</small></div><div class="metric"><small>UTILIZED</small><h2>'+cr(utilized)+'</h2><small>'+Math.round(utilized/approved*100)+'% of approved</small></div></div><div class="actions"><a class="primary" href="report.html?project='+encodeURIComponent(id)+'">Report an issue</a><a class="outline" href="funds.html">View fund register</a><a class="outline" href="map.html">View project map</a></div><div class="cols"><div class="box"><p class="eyebrow">IDENTITY & ACCOUNTABILITY</p><h2>Project information</h2><dl><dt>Project ID</dt><dd>'+esc(id)+'</dd><dt>Category</dt><dd>'+esc(type)+'</dd><dt>Location</dt><dd>'+esc(place)+'</dd><dt>Department</dt><dd>'+esc(dept)+'</dd><dt>Contractor</dt><dd>'+esc(contractor)+'</dd><dt>Start date</dt><dd>'+esc(start)+'</dd><dt>Target completion</dt><dd>'+esc(end)+'</dd></dl></div><div class="box"><p class="eyebrow">FINANCIAL LEDGER</p><h2>Fund flow</h2><div class="row"><span>Approved</span><b>'+cr(approved)+'</b></div><div class="row"><span>Released</span><b>'+cr(released)+'</b></div><div class="row"><span>Utilized</span><b>'+cr(utilized)+'</b></div><div class="row"><span>Remaining released</span><b>'+cr(bal)+'</b></div></div></div><div class="box"><p class="eyebrow">IMPLEMENTATION TRACK</p><h2>Progress timeline</h2><div class="timeline"><div class="step"><b>Project approved</b><span>Entered into the prototype register</span></div><div class="step"><b>Work commenced</b><span>'+esc(start)+'</span></div><div class="step current"><b>Current reported progress</b><span>'+progress+'% • '+esc(status)+'</span></div><div class="step"><b>Target completion</b><span>'+esc(end)+'</span></div></div></div><div class="cols"><div class="box"><p class="eyebrow">SOURCE & VERIFICATION</p><h2>Evidence register</h2><div class="warning"><b>⚠ Not yet verified</b><br>No live government database or verified government document is connected to this prototype record.</div><div class="row"><span>Administrative record</span><b>Placeholder</b></div><div class="row"><span>Sanction / release record</span><b>Placeholder</b></div><div class="row"><span>Worksite evidence</span><b>Placeholder</b></div><div class="row"><span>Inspection record</span><b>Placeholder</b></div></div><div class="box"><p class="eyebrow">SPATIAL CONTEXT</p><h2>Project location</h2><div class="map"><b>📍 '+esc(place)+'</b></div><p class="lead">Illustrative map position only; not an authoritative GIS boundary.</p></div></div><div class="box"><p class="eyebrow">GROUND REALITY</p><h2>Citizen ground reports</h2><p class="lead">Citizen observations are intentionally separated from official/public-source information.</p><div class="warning">No citizen reports linked to this project in the current demo view.</div></div><div class="note"><b>Transparency note:</b> This is an independent civic transparency prototype. Demo figures are illustrative and are not verified government records. Citizen reports represent user observations and should not be treated as official findings.</div>'}document.addEventListener('DOMContentLoaded',()=>{render();const b=document.querySelector
